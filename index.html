<title>Ten things before the year ends</title>

<style>
  :root{
    --deep:#0D2329; --line:#2C555E; --paper:#E9F1EE;
    --muted:#8FAFAE; --glass:#9CC5B4; --sun:#F0A868;
    --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
    --body:"Newsreader",Georgia,serif;
    --mono:"DM Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--deep);
    background-image:
      radial-gradient(120% 80% at 78% -10%, rgba(240,168,104,.16), transparent 60%),
      radial-gradient(90% 60% at 5% 105%, rgba(156,197,180,.12), transparent 65%);
    color:var(--paper); font-family:var(--body);
    -webkit-font-smoothing:antialiased;
  }
  #gate{
    min-height:100vh; display:flex; align-items:center;
    justify-content:center; padding:24px;
  }
  .box{width:100%; max-width:380px;}
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--glass); margin:0;
  }
  .box h1{
    font-family:var(--display); font-weight:800;
    font-size:clamp(30px,7vw,42px); line-height:1;
    letter-spacing:-.03em; margin:16px 0 0;
  }
  .box h1 em{font-style:normal; color:var(--sun);}
  .box p.sub{
    font-weight:300; font-size:17px; color:#CFE0DB; margin:14px 0 28px;
  }
  label{
    display:block; font-family:var(--mono); font-size:11px;
    letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:9px;
  }
  .row{display:flex; gap:8px;}
  input{
    flex:1; min-width:0; background:rgba(255,255,255,.04);
    border:1px solid var(--line); border-radius:2px 10px 10px 10px;
    color:var(--paper); font-family:var(--mono); font-size:16px;
    padding:13px 14px;
  }
  input:focus-visible, button:focus-visible{
    outline:2px solid var(--sun); outline-offset:2px;
  }
  button{
    background:var(--sun); border:0; border-radius:10px 2px 10px 10px;
    color:#0D2329; font-family:var(--mono); font-size:13px;
    letter-spacing:.08em; text-transform:uppercase;
    padding:0 18px; cursor:pointer;
  }
  button:hover{background:#F5B87F;}
  button[disabled]{opacity:.55; cursor:progress;}
  .msg{
    font-family:var(--mono); font-size:12.5px; color:var(--sun);
    margin:14px 0 0; min-height:18px; letter-spacing:.03em;
  }
</style>

<div id="gate">
  <div class="box">
    <p class="eyebrow">31 August 2016 &#8594; 31 August 2026</p>
    <h1>Ten years,<br>ten <em>things</em></h1>
    <p class="sub">This one needs a word first.</p>
    <label for="pw">Passphrase</label>
    <div class="row">
      <input id="pw" type="password" autocomplete="off" autocapitalize="none"
             spellcheck="false" aria-describedby="msg">
      <button id="go" type="button">Open</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </div>
</div>

  var pw = document.getElementById('pw'),
      go = document.getElementById('go'),
      msg = document.getElementById('msg');

  function b2a(b){
    var raw = atob(b), out = new Uint8Array(raw.length);
    for (var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  async function open_(){
    var word = pw.value.trim();
    if(!word){ msg.textContent = 'Type the word first.'; pw.focus(); return; }
    go.disabled = true; msg.textContent = 'Checking...';
    try{
      var enc = new TextEncoder();
      var base = await crypto.subtle.importKey('raw', enc.encode(word),
                   'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b2a(D.S), iterations:D.N, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt(
        {name:'AES-GCM', iv:b2a(D.I)}, key, b2a(D.C));
      document.getElementById('gate').remove();
      document.body.innerHTML = new TextDecoder().decode(plain);
      document.title = 'Ten things before the year ends';
    }catch(e){
      go.disabled = false;
      msg.textContent = 'Not that word. Try again.';
      pw.select();
    }
  }

  go.addEventListener('click', open_);
  pw.addEventListener('keydown', function(e){ if(e.key === 'Enter') open_(); });
  pw.focus();
})();
